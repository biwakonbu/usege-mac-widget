name: UsegeMacWidget
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  UsegeApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/UsegeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usege.macwidget.app
        PRODUCT_NAME: Usege
        INFOPLIST_FILE: Config/UsegeApp-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/UsegeApp.entitlements
        ENABLE_APP_SANDBOX: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: UsegeWidgetExtension
        embed: true

  UsegeWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/UsegeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usege.macwidget.app.widget
        PRODUCT_NAME: UsegeWidgetExtension
        INFOPLIST_FILE: Config/UsegeWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/UsegeWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  UsegeNativeHost:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/UsegeNativeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usege.macwidget.nativehost
        PRODUCT_NAME: usege-native-host
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  UsegeAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/UsegeAppTests
    dependencies:
      - target: UsegeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.usege.macwidget.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Usege.app/Contents/MacOS/Usege
        BUNDLE_LOADER: $(TEST_HOST)
